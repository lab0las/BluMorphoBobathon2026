version: '3.8'

services:
  workout-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workout-recommendation-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - workout-network

networks:
  workout-network:
    driver: bridge

